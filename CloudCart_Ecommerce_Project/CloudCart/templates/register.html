{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">JOIN THE GOOD FINDS CLUB</span><h1>Create your <span>account.</span></h1><p>Save your details and keep track of your orders.</p><form method="post" class="form-stack"><label>Full name<input name="name" required maxlength="100" placeholder="Your name"></label><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></label><button class="btn btn-full" type="submit">Create account →</button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
