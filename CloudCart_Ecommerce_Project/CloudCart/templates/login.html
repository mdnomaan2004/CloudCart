{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Good to see <span>you.</span></h1><p>Log in to continue your CloudCart experience.</p><form method="post" class="form-stack"><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required placeholder="Your password"></label><button class="btn btn-full" type="submit">Log in →</button></form><p class="auth-switch">New to CloudCart? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
