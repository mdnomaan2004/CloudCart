{% extends "base.html" %}{% block title %}{% if product %}Edit{% else %}Add{% endif %} product{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card auth-wide"><span class="eyebrow">STORE MANAGEMENT</span><h1>{% if product %}Edit{% else %}Add a{% endif %} <span>product.</span></h1><form method="post" class="form-stack"><label>Product name<input name="name" required value="{{ product.name if product else '' }}"></label><label>Description<textarea name="description" rows="3" required>{{ product.description if product else '' }}</textarea></label><div class="form-two"><label>Price (₹)<input type="number" name="price" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Stock quantity<input type="number" name="stock" min="0" required value="{{ product.stock if product else 10 }}"></label></div><div class="form-two"><label>Category<input name="category" required value="{{ product.category if product else '' }}"></label><label>Image URL<input type="url" name="image_url" required value="{{ product.image_url if product else '' }}"></label></div><label class="checkbox-label"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Show as featured product</label><button class="btn btn-full" type="submit">Save product →</button></form></div></section>{% endblock %}
